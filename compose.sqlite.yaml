# Уровень 6: одно приложение, счётчик в SQLite на именованном volume.
# Запуск: docker compose -f compose.sqlite.yaml up -d --build

name: hw3-sqlite

services:
  app:
    build: .
    environment:
      STORAGE: sqlite
      DATA_FILE: /data/counter.db
      GREETING: ${GREETING:-Hello, Docker!}
      PORT: "8000"
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - counter_data:/data

volumes:
  counter_data:
